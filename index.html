<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی مار - امیر حسین درویشان</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#111;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
    text-align:center;
}

h1{
    color:#e00000;
    margin:20px 0 10px;
}

#score{
    font-size:22px;
    margin:10px;
}

#game{
    width:400px;
    max-width:90vw;
    height:400px;
    max-height:90vw;
    margin:20px auto;
    background:#000;
    border:3px solid #e00000;
    position:relative;
    overflow:hidden;
}

.snake{
    position:absolute;
    width:20px;
    height:20px;
    background:#e00000;
    border-radius:4px;
}

.head{
    background:#ff3333;
}

.food{
    position:absolute;
    width:20px;
    height:20px;
    background:white;
    border-radius:50%;
}

button{
    background:#e00000;
    color:white;
    border:0;
    padding:12px 25px;
    margin:8px;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#b00000;
}

#gameOver{
    display:none;
    margin:15px;
    font-size:22px;
    color:#ff3333;
}

#status{
    min-height:28px;
    margin:10px;
    color:#aaa;
}
</style>
</head>

<body>

<h1>🐍 امیر حسین درویشان</h1>

<div id="score">امتیاز: 0</div>
<div id="best">رکورد: 0</div>

<div id="game"></div>

<div id="gameOver">
    💥 بازی تمام شد!
</div>

<div id="status"></div>

<button onclick="startGame()">شروع دوباره</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://bfblbmvrmwuwceghoqet.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_BpQzudTwE6pAGVHe9whOiA_LPJo2si3";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================
   PLAYER ID
========================= */

let onlinePlayerId =
    localStorage.getItem("onlinePlayerId");

if(!onlinePlayerId){
    onlinePlayerId = crypto.randomUUID();

    localStorage.setItem(
        "onlinePlayerId",
        onlinePlayerId
    );
}


/* =========================
   GAME VARIABLES
========================= */

const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const gameOverText = document.getElementById("gameOver");
const statusText = document.getElementById("status");

const gridSize = 20;

let snake = [];
let food = {};

let direction = {
    x:1,
    y:0
};

let nextDirection = {
    x:1,
    y:0
};

let score = 0;

let highScore =
    Number(localStorage.getItem("snakeBest")) ||
    Number(localStorage.getItem("snakeHighScore")) ||
    0;

let gameRunning = false;
let gameTimer;


/* =========================
   SHOW BEST
========================= */

bestText.textContent =
    "رکورد: " + highScore;


/* =========================
   START GAME
========================= */

function startGame(){

    clearInterval(gameTimer);

    snake = [
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    direction = {
        x:1,
        y:0
    };

    nextDirection = {
        x:1,
        y:0
    };

    score = 0;

    scoreText.textContent =
        "امتیاز: 0";

    gameOverText.style.display =
        "none";

    statusText.textContent =
        "";

    createFood();

    gameRunning = true;

    draw();

    gameTimer = setInterval(
        update,
        150
    );
}


/* =========================
   UPDATE
========================= */

function update(){

    if(!gameRunning) return;

    direction = nextDirection;

    const head = {
        x:snake[0].x + direction.x,
        y:snake[0].y + direction.y
    };


    /* برخورد با دیوار */

    if(
        head.x < 0 ||
        head.x >= gridSize ||
        head.y < 0 ||
        head.y >= gridSize
    ){
        endGame();
        return;
    }


    /* برخورد با خودش */

    for(let i=0;i<snake.length;i++){

        if(
            head.x === snake[i].x &&
            head.y === snake[i].y
        ){
            endGame();
            return;
        }
    }


    snake.unshift(head);


    /* خوردن غذا */

    if(
        head.x === food.x &&
        head.y === food.y
    ){

        score++;

        scoreText.textContent =
            "امتیاز: " + score;

        createFood();

    }else{

        snake.pop();

    }

    draw();
}


/* =========================
   DRAW
========================= */

function draw(){

    game.innerHTML = "";


    /* غذا */

    const foodElement =
        document.createElement("div");

    foodElement.className =
        "food";

    foodElement.style.left =
        food.x * 20 + "px";

    foodElement.style.top =
        food.y * 20 + "px";

    game.appendChild(foodElement);


    /* مار */

    snake.forEach((part,index)=>{

        const element =
            document.createElement("div");

        element.className =
            "snake";

        if(index === 0){
            element.classList.add("head");
        }

        element.style.left =
            part.x * 20 + "px";

        element.style.top =
            part.y * 20 + "px";

        game.appendChild(element);

    });
}


/* =========================
   FOOD
========================= */

function createFood(){

    let valid = false;

    while(!valid){

        food = {
            x:Math.floor(
                Math.random()*gridSize
            ),
            y:Math.floor(
                Math.random()*gridSize
            )
        };

        valid = true;

        for(const part of snake){

            if(
                part.x === food.x &&
                part.y === food.y
            ){
                valid = false;
                break;
            }
        }
    }
}


/* =========================
   GAME OVER
========================= */

async function endGame(){

    gameRunning = false;

    clearInterval(gameTimer);

    gameOverText.style.display =
        "block";


    /* رکورد آفلاین */

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "snakeBest",
            highScore
        );

        /* برای نسخه قدیمی هم نگه می‌داریم */

        localStorage.setItem(
            "snakeHighScore",
            highScore
        );

        bestText.textContent =
            "رکورد: " + highScore;
    }


    /* ارسال به آنلاین */

    if(score > 0){

        await submitOnlineScore(
            "snake",
            score
        );

    }else{

        statusText.textContent =
            "بازی تمام شد";

    }
}


/* =========================
   ONLINE SCORE
========================= */

async function submitOnlineScore(
    gameName,
    scoreValue
){

    try{

        statusText.textContent =
            "در حال ثبت رکورد آنلاین...";

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "submit_score",
            {
                p_player_id:
                    onlinePlayerId,

                p_game:
                    gameName,

                p_score:
                    Number(scoreValue)
            }
        );


        if(error){

            console.error(
                "Supabase error:",
                error
            );

            statusText.textContent =
                "❌ رکورد آنلاین ثبت نشد";

            return false;
        }


        statusText.textContent =
            "✅ رکورد آنلاین ثبت شد";

        console.log(
            "Online score:",
            data
        );

        return true;

    }catch(error){

        console.error(error);

        statusText.textContent =
            "❌ خطا در اتصال به آنلاین";

        return false;
    }
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "ArrowUp" &&
            direction.y !== 1
        ){

            nextDirection = {
                x:0,
                y:-1
            };

        }

        if(
            e.key === "ArrowDown" &&
            direction.y !== -1
        ){

            nextDirection = {
                x:0,
                y:1
            };

        }

        if(
            e.key === "ArrowLeft" &&
            direction.x !== 1
        ){

            nextDirection = {
                x:-1,
                y:0
            };

        }

        if(
            e.key === "ArrowRight" &&
            direction.x !== -1
        ){

            nextDirection = {
                x:1,
                y:0
            };

        }
    }
);


/* =========================
   START
========================= */

startGame();

</script>

</body>
</html>
